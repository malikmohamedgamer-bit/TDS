# Render blueprint for the TDS co-op relay (server/relay.mjs). Setup: docs/DEPLOY-ONLINE.md, part B.
# Render dashboard > New > Blueprint > pick this repository. It creates one free web service.
# The free plan sleeps after about 15 minutes without traffic and takes up to about a minute to
# wake. The game shows "connecting" and retries for up to 60 s while no connection can be opened,
# then says "Could not reach the relay server": press Join again, or open <address>/health a
# minute before playing to wake it.
services:
  - type: web
    name: tds-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node relay.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Render sets PORT itself. Put your game's address here (comma list), for example
      # https://yourname.github.io ; leave empty to allow every site (fine for testing).
      - key: ALLOWED_ORIGINS
        sync: false
