<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12141C">
  <meta name="description" content="TDS: a 3D tower defense game. Magic and Modern War defend the valley against the Blight.">
  <title>TDS: Tower Defense</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="TDS: Tower Defense">
  <meta property="og:description" content="A free 3D tower defense game in the browser. Magic and Modern War defend the valley against the Blight. 60 maps, 100 towers, 200 enemies, 100 bosses, 10 heroes. No ads, no purchases.">
  <meta property="og:image" content="assets/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 8v12l-12 8L4 22V10z' fill='%237B4DFF'/%3E%3Cpath d='M16 8l6 4v8l-6 4-6-4v-8z' fill='%23FFD166'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/match.css">
  <link rel="stylesheet" href="styles/hub.css">
  <link rel="stylesheet" href="styles/theme.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Game view" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="loading" role="status" aria-live="polite">
    <div class="load-logo" aria-hidden="true">◆</div>
    <h1>TDS</h1>
    <p class="load-tag">Magic and Modern War hold the line against the Blight</p>
    <div class="load-bar" aria-hidden="true"><span></span></div>
    <p class="load-text">Starting…</p>
    <p class="load-tip"><b>Tip</b><span id="load-tip-text">Frost towers slow everything in range: put them where the road bends.</span></p>
  </div>
  <script>
    (function () {
      var tips = ['Frost towers slow everything in range: put them where the road bends.', 'Flying enemies ignore traps. Bring at least one tower that hits air.', 'Stealth enemies need a tower with detection, or a hero skill that reveals them.', 'Press N to start the next wave early for bonus cash.', 'Bosses telegraph big attacks with a ring on the ground: move towers out or burst them first.', 'Permanent tower levels carry into every match. Spend Crowns in the Towers tab.', 'Right-click or tap a placed tower to upgrade it, change targeting or sell it.', 'Armoured enemies shrug off bullets; magic and explosives cut through.'];
      document.getElementById('load-tip-text').textContent = tips[Math.floor(Math.random() * tips.length)];
    })();
  </script>
  <noscript><p class="noscript">TDS needs JavaScript and WebGL to run.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
